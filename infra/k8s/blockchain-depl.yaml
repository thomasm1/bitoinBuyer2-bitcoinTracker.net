apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockchain
  template:
    metadata:
      labels:
        app: blockchain
    spec:
    containers:
      - name: blockchain
        image: thomasm1/blockchain
--- 
apiVersion: v1
kind: Service
metadata:
  name: blockchain-clusterip-srv
spec:
  selector:
    app: blockchain
  ports:
    - name: blockchain
      protocol: TCP
      port: 9009
      targetPort: 9009
